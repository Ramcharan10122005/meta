<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Campus Tour</title>
    <!-- Import Google Font for a modern aesthetic -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #121212; /* Dark theme background */
        }

        #tour-iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1; /* Stay behind the control panel */
        }

        /* Floating control panel with glassmorphism */
        #control-panel {
            position: absolute;
            top: 24px;
            left: 24px;
            z-index: 10;
            background: rgba(20, 20, 20, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 260px;
            transition: transform 0.3s ease;
        }

        .panel-title {
            color: #ffffff;
            margin: 0;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Custom dropdown styling */
        .select-wrapper {
            position: relative;
            width: 100%;
        }

        select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
            font-size: 14px;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        select:focus, select:hover {
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
        }

        select option {
            background: #1a1a1a;
            color: #ffffff;
            padding: 10px;
        }

        .select-arrow {
            position: absolute;
            top: 50%;
            right: 16px;
            transform: translateY(-50%);
            pointer-events: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 10px;
        }

        button {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
            border: none;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
            filter: brightness(1.1);
        }

        button:active {
            transform: translateY(1px);
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
        }
    </style>
</head>
<body>

    <div id="control-panel">
        <h2 class="panel-title">Campus Tour</h2>
        <div class="select-wrapper">
            <select id="tour-select">
                <option value="morning/app-files/index.html">Morning</option>
                <option value="evening/app-files/index.html">Afternoon</option>
                <option value="night/app-files/index.html">Inside Campus</option>
            </select>
            <div class="select-arrow">▼</div>
        </div>
        <button id="load-btn">Load Tour</button>
    </div>

    <!-- Iframe taking full screen behind the control panel -->
    <iframe id="tour-iframe" src="morning/app-files/index.html" allowfullscreen></iframe>

    <script>
        document.getElementById('load-btn').addEventListener('click', () => {
            const selectElement = document.getElementById('tour-select');
            const iframeElement = document.getElementById('tour-iframe');
            
            const newSrc = selectElement.value;
            
            // Add a subtle transition effect
            iframeElement.style.transition = 'opacity 0.3s ease-out';
            iframeElement.style.opacity = 0;
            
            setTimeout(() => {
                iframeElement.src = newSrc;
                
                // Once the new iframe content loads, fade it back in
                iframeElement.onload = () => {
                    iframeElement.style.transition = 'opacity 0.5s ease-in';
                    iframeElement.style.opacity = 1;
                };
            }, 300);
        });
    </script>
</body>
</html>
