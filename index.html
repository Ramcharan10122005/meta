<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Campus Tour</title>
    <!-- Import Google Font for a modern aesthetic -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #121212;
            /* Dark theme background */
        }

        #tour-iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            /* Stay behind the control panel */
        }

        /* Floating control panel with glassmorphism */
        #control-panel {
            position: absolute;
            top: 24px;
            left: 24px;
            z-index: 10;
            background: rgba(20, 20, 20, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 260px;
            transition: transform 0.3s ease;
        }

        .panel-title {
            color: #ffffff;
            margin: 0;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Custom dropdown styling */
        .select-wrapper {
            position: relative;
            width: 100%;
        }

        select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
            font-size: 14px;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        select:focus,
        select:hover {
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
        }

        select option {
            background: #1a1a1a;
            color: #ffffff;
            padding: 10px;
        }

        .select-arrow {
            position: absolute;
            top: 50%;
            right: 16px;
            transform: translateY(-50%);
            pointer-events: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 10px;
        }

        button {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
            border: none;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
            filter: brightness(1.1);
        }

        button:active {
            transform: translateY(1px);
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
        }
    </style>
</head>

<body>

    <div id="control-panel">
        <h2 class="panel-title">Campus Tour</h2>

        <div class="select-wrapper">
            <select id="tour-select">
                <option value="morning/app-files/index.html">Morning</option>
                <option value="evening/app-files/index.html">Afternoon</option>
                <option value="night/app-files/index.html">Inside Campus</option>
            </select>
            <div class="select-arrow">▼</div>
        </div>

        <button id="load-btn">Load Tour</button>

        <!-- 🔊 AUDIO CONTROL -->
        <button id="audio-btn">🔊 Mute Audio</button>

        <!-- 🥽 VR MODE -->
        <button id="vr-btn">🥽 VR Mode</button>
    </div>

    <!-- Iframe taking full screen behind the control panel -->
    <iframe id="tour-iframe" src="morning/app-files/index.html" allowfullscreen></iframe>
    <div style="
    position: fixed;
    top: 50%;
    left: 50%;
    width: 10px;
    height: 10px;
    background: white;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    z-index: 999;
    pointer-events: none;">
    </div>
    <script>
        let isMuted = false;

        // 🎯 LOAD TOUR (your logic + improved)
        document.getElementById('load-btn').addEventListener('click', () => {
            const selectElement = document.getElementById('tour-select');
            const iframeElement = document.getElementById('tour-iframe');

            const newSrc = selectElement.value;

            // fade out
            iframeElement.style.transition = 'opacity 0.3s ease-out';
            iframeElement.style.opacity = 0;

            setTimeout(() => {
                iframeElement.src = newSrc;

                iframeElement.onload = () => {
                    iframeElement.style.transition = 'opacity 0.5s ease-in';
                    iframeElement.style.opacity = 1;

                    // 🔥 reset audio button when new tour loads
                    isMuted = false;
                    document.getElementById("audio-btn").innerText = "🔊 Mute Audio";
                };
            }, 300);
        });


        // 🔊 AUDIO CONTROL (controls audio inside iframe)
        document.getElementById("audio-btn").addEventListener("click", function () {
            const iframe = document.getElementById("tour-iframe");

            try {
                const audio = iframe.contentWindow.audio;

                if (audio) {
                    if (isMuted) {
                        audio.muted = false;
                        this.innerText = "🔊 Mute Audio";
                    } else {
                        audio.muted = true;
                        this.innerText = "🔇 Unmute Audio";
                    }
                    isMuted = !isMuted;
                }
            } catch (e) {
                console.log("Audio not ready yet");
            }
        });


        // 🥽 VR MODE (fullscreen)
        document.getElementById("vr-btn").addEventListener("click", function () {
            const iframe = document.getElementById("tour-iframe");

            // 🔥 Enter fullscreen (cross-browser)
            if (iframe.requestFullscreen) {
                iframe.requestFullscreen();
            } else if (iframe.webkitRequestFullscreen) {
                iframe.webkitRequestFullscreen();
            } else if (iframe.msRequestFullscreen) {
                iframe.msRequestFullscreen();
            }

            // 🔥 Lock orientation for better VR (mobile / Meta Quest)
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock("landscape").catch(() => { });
            }

            // 🔥 Small UX improvement (hide control panel in VR)
            const panel = document.getElementById("control-panel");
            if (panel) {
                panel.style.display = "none";
            }

            // 🔥 Show panel again when exiting fullscreen
            document.addEventListener("fullscreenchange", function () {
                if (!document.fullscreenElement) {
                    if (panel) panel.style.display = "flex";
                }
            });
        });
    </script>
</body>

</html>
