<!DOCTYPE html>
<html>

<head>
    <title>Afternoon VR Tour</title>

    <!-- A-Frame (WebXR) -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <!-- Make hotspots face camera -->
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
</head>

<body>

    <a-scene vr-mode-ui="enabled: true">

        <!-- CAMERA -->
        <a-entity camera look-controls position="0 1.6 0"></a-entity>

        <!-- SKY -->
        <a-sky id="sky" material="opacity: 1"></a-sky>

        <!-- HOTSPOTS -->
        <a-entity id="hotspots"></a-entity>

    </a-scene>

    <script>

        let scenesMap = {};
        let currentAudio = null;

        // 🚀 LOAD DATA
        async function loadData() {

            let text = await fetch("./evening/app-files/data.js").then(r => r.text());

            let json = JSON.parse(
                text.replace("var APP_DATA =", "").trim().slice(0, -1)
            );

            json.scenes.forEach(s => {
                scenesMap[s.id] = s;
            });

            loadScene(json.scenes[0].id);
        }

        // 🎯 Convert yaw/pitch → 3D
        function toPosition(yaw, pitch) {
            let r = 4;
            return {
                x: r * Math.sin(yaw) * Math.cos(pitch),
                y: r * Math.sin(pitch),
                z: -r * Math.cos(yaw) * Math.cos(pitch)
            };
        }

        // 🎯 LOAD SCENE
        function loadScene(id) {

            let scene = scenesMap[id];
            if (!scene) return;

            let sky = document.getElementById("sky");

            // 🔥 Fade out
            sky.setAttribute("animation__fadeout", {
                property: "material.opacity",
                to: 0,
                dur: 400
            });

            setTimeout(() => {

                // ✅ LOAD IMAGE (using scene.name)
                sky.setAttribute("src", "./vr-images/" + scene.name.toLowerCase() + ".jpg");

                // 🔥 Fade in
                sky.setAttribute("animation__fadein", {
                    property: "material.opacity",
                    to: 1,
                    dur: 400
                });

            }, 400);

            // 🔊 AUDIO
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }

            currentAudio = new Audio("./audio/" + scene.name.toLowerCase() + ".mp3");
            currentAudio.play().catch(() => { });

            // 🔥 CLEAR OLD HOTSPOTS
            let container = document.getElementById("hotspots");
            container.innerHTML = "";

            // 🔥 SAFE HOTSPOT ACCESS
            let hotspots = scene.linkHotspots || scene.hotspots || [];

            hotspots.forEach(h => {

                if (!scenesMap[h.target]) return;

                let pos = toPosition(h.yaw, h.pitch);

                let el = document.createElement("a-entity");

                // 🔵 CIRCLE HOTSPOT (no image needed)
                el.setAttribute("geometry", "primitive: circle; radius: 0.25");
                el.setAttribute("material", "color: #00ffff; shader: flat");

                // position
                el.setAttribute("position", `${pos.x} ${pos.y} ${pos.z}`);

                // face camera
                el.setAttribute("look-at", "[camera]");

                // 🔥 pulse animation
                el.setAttribute("animation__scale", {
                    property: "scale",
                    dir: "alternate",
                    dur: 800,
                    loop: true,
                    to: "1.3 1.3 1.3"
                });

                // 🔥 floating animation
                el.setAttribute("animation__float", {
                    property: "position",
                    dir: "alternate",
                    dur: 1200,
                    loop: true,
                    to: `${pos.x} ${pos.y + 0.2} ${pos.z}`
                });

                // click event
                el.addEventListener("click", () => loadScene(h.target));

                container.appendChild(el);
            });
        }

        // 🚀 START
        loadData();

    </script>

</body>

</html>
