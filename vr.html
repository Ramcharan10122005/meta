<!DOCTYPE html>
<html>

<head>
    <title>Afternoon VR Tour</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <!-- Look-at -->
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
</head>

<body>

    <a-scene vr-mode-ui="enabled: true">

        <!-- CAMERA + CURSOR -->
        <a-entity id="cam" camera look-controls position="0 1.6 0">

            <a-cursor fuse="true" fuse-timeout="1000" raycaster="objects: .clickable"
                material="color: white; shader: flat" geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.02">
            </a-cursor>

        </a-entity>

        <!-- SKY -->
        <a-sky id="sky" material="opacity: 1"></a-sky>

        <!-- HOTSPOTS -->
        <a-entity id="hotspots"></a-entity>

    </a-scene>

    <script>

        let scenesMap = {};
        let currentAudio = null;

        // 🚀 LOAD DATA
        async function loadData() {

            let text = await fetch("./evening/app-files/data.js").then(r => r.text());

            let json = JSON.parse(
                text.replace("var APP_DATA =", "").trim().slice(0, -1)
            );

            json.scenes.forEach(s => {
                scenesMap[s.id] = s;
            });

            loadScene(json.scenes[0].id);
        }

        // 🎯 FINAL CORRECT CONVERSION
        function toPosition(yaw, pitch, baseYaw) {

            let r = 10;

            // 🔥 MOST IMPORTANT FIX
            let finalYaw = yaw - baseYaw;

            return {
                x: r * Math.sin(finalYaw) * Math.cos(pitch),
                y: r * Math.sin(pitch),
                z: -r * Math.cos(finalYaw) * Math.cos(pitch)
            };
        }

        // 🎯 LOAD SCENE
        function loadScene(id) {

            let scene = scenesMap[id];
            if (!scene) return;

            let sky = document.getElementById("sky");

            // Fade out
            sky.setAttribute("animation__fadeout", {
                property: "material.opacity",
                to: 0,
                dur: 400
            });

            setTimeout(() => {

                sky.setAttribute("src", "./vr-images/" + scene.name.toLowerCase() + ".jpg");

                sky.setAttribute("animation__fadein", {
                    property: "material.opacity",
                    to: 1,
                    dur: 400
                });

            }, 400);

            // 🎯 SET CAMERA VIEW (CRITICAL)
            let cam = document.getElementById("cam");

            let initYaw = scene.initialViewParameters?.yaw || 0;
            let initPitch = scene.initialViewParameters?.pitch || 0;

            cam.setAttribute("rotation", {
                x: THREE.MathUtils.radToDeg(initPitch),
                y: THREE.MathUtils.radToDeg(initYaw),
                z: 0
            });

            // 🔊 AUDIO
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }

            currentAudio = new Audio("./audio/" + scene.name.toLowerCase() + ".mp3");
            currentAudio.play().catch(() => { });

            // CLEAR HOTSPOTS
            let container = document.getElementById("hotspots");
            container.innerHTML = "";

            let hotspots = scene.linkHotspots || [];

            hotspots.forEach(h => {

                if (!scenesMap[h.target]) return;

                let pos = toPosition(h.yaw, h.pitch, initYaw);

                let el = document.createElement("a-entity");

                el.setAttribute("geometry", "primitive: circle; radius: 0.45");
                el.setAttribute("material", "color: #00ffff; shader: flat");

                el.setAttribute("position", `${pos.x} ${pos.y} ${pos.z}`);
                el.setAttribute("look-at", "#cam");
                el.setAttribute("class", "clickable");

                // Pulse
                el.setAttribute("animation__scale", {
                    property: "scale",
                    dir: "alternate",
                    dur: 800,
                    loop: true,
                    to: "1.3 1.3 1.3"
                });

                // Click
                el.addEventListener("click", () => loadScene(h.target));

                container.appendChild(el);
            });
        }

        // START
        loadData();

    </script>

</body>

</html>
