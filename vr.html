<!DOCTYPE html>
<html>

<head>
    <title>VR Debug Mode</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>

<body>

    <a-scene vr-mode-ui="enabled: true">

        <!-- CAMERA -->
        <a-entity id="cam" camera look-controls position="0 1.6 0">

            <!-- CURSOR -->
            <a-cursor fuse="true" fuse-timeout="1000" raycaster="objects: .clickable"
                geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.02" material="color: white">
            </a-cursor>

        </a-entity>

        <!-- SKY -->
        <a-sky id="sky"></a-sky>

        <!-- HOTSPOTS -->
        <a-entity id="hotspots"></a-entity>

    </a-scene>

    <script>

        let scenesMap = {};
        let currentAudio = null;

        // LOAD DATA
        async function loadData() {

            let text = await fetch("./evening/app-files/data.js").then(r => r.text());

            let json = JSON.parse(
                text.replace("var APP_DATA =", "").trim().slice(0, -1)
            );

            json.scenes.forEach(s => scenesMap[s.id] = s);

            loadScene(json.scenes[0].id);
        }

        // LOAD SCENE
        function loadScene(id) {

            let scene = scenesMap[id];
            if (!scene) return;

            console.log("========== SCENE LOAD ==========");
            console.log("Scene Name:", scene.name);
            console.log("Initial Yaw:", scene.initialViewParameters?.yaw);
            console.log("Initial Pitch:", scene.initialViewParameters?.pitch);

            // SET SKY
            document.getElementById("sky")
                .setAttribute("src", "./vr-images/" + scene.name.toLowerCase() + ".jpg");

            // SET CAMERA
            let cam = document.getElementById("cam");

            let yaw = scene.initialViewParameters?.yaw || 0;
            let pitch = scene.initialViewParameters?.pitch || 0;

            let rotX = THREE.MathUtils.radToDeg(pitch);
            let rotY = THREE.MathUtils.radToDeg(-yaw);

            cam.setAttribute("rotation", `${rotX} ${rotY} 0`);

            console.log("Camera Rotation:", rotX, rotY);

            // CLEAR HOTSPOTS
            let container = document.getElementById("hotspots");
            container.innerHTML = "";

            let hotspots = scene.linkHotspots || [];

            hotspots.forEach((h, index) => {

                console.log("------ HOTSPOT ------");
                console.log("Index:", index);
                console.log("Target:", h.target);
                console.log("Yaw:", h.yaw);
                console.log("Pitch:", h.pitch);

                let el = document.createElement("a-entity");

                // 🔴 DEBUG: big red sphere (easy to see)
                el.setAttribute("geometry", "primitive: sphere; radius: 0.4");
                el.setAttribute("material", "color: red");

                // 🔥 rotation-based placement
                let hRotX = THREE.MathUtils.radToDeg(-h.pitch);
                let hRotY = THREE.MathUtils.radToDeg(-h.yaw);

                console.log("Applied Rotation:", hRotX, hRotY);

                el.setAttribute("rotation", `${hRotX} ${hRotY} 0`);

                // push forward
                el.setAttribute("position", "0 0 -10");

                el.setAttribute("class", "clickable");

                el.addEventListener("click", () => {
                    console.log("CLICKED:", h.target);
                    loadScene(h.target);
                });

                container.appendChild(el);
            });
        }

        // START
        loadData();

    </script>

</body>

</html>
