<!DOCTYPE html>
<html>

<head>
    <title>Marzipano Perfect Clone</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>

<body>

    <a-scene>

        <!-- CAMERA -->
        <a-entity camera look-controls position="0 1.6 0">
            <a-cursor fuse="true" fuse-timeout="1000" raycaster="objects: .clickable"
                geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.02" material="color: white">
            </a-cursor>
        </a-entity>

        <!-- SKY -->
        <a-sky id="sky"></a-sky>

        <!-- HOTSPOTS -->
        <a-entity id="hotspots"></a-entity>

    </a-scene>

    <script>

        let scenesMap = {};

        // LOAD DATA.JS
        async function loadData() {

            let text = await fetch("./evening/app-files/data.js").then(r => r.text());

            let json = JSON.parse(
                text.replace("var APP_DATA =", "").trim().slice(0, -1)
            );

            json.scenes.forEach(s => {
                scenesMap[s.id] = s;
            });

            loadScene(json.scenes[0].id);
        }


        // LOAD SCENE
        function loadScene(id) {

            let scene = scenesMap[id];
            if (!scene) return;

            let sky = document.getElementById("sky");

            // LOAD IMAGE
            sky.setAttribute("src", "./vr-images/" + scene.name.toLowerCase() + ".jpg");


            // 🔥 IMPORTANT: APPLY INITIAL VIEW TO SKY (NOT CAMERA)
            let baseYaw = scene.initialViewParameters?.yaw || 0;
            let basePitch = scene.initialViewParameters?.pitch || 0;

            sky.setAttribute("rotation", {
                x: -THREE.MathUtils.radToDeg(basePitch),
                y: -THREE.MathUtils.radToDeg(baseYaw),
                z: 0
            });


            // CLEAR HOTSPOTS
            let container = document.getElementById("hotspots");
            container.innerHTML = "";

            let hotspots = scene.linkHotspots || [];

            hotspots.forEach(h => {

                if (!scenesMap[h.target]) return;

                let el = document.createElement("a-entity");

                // STYLE
                el.setAttribute("geometry", "primitive: circle; radius: 0.35");
                el.setAttribute("material", "color: cyan; shader: flat");
                el.setAttribute("class", "clickable");

                // 🔥 DIRECT USE (NO EXTRA OFFSET NEEDED)
                let yawDeg = THREE.MathUtils.radToDeg(h.yaw);
                let pitchDeg = THREE.MathUtils.radToDeg(h.pitch);

                el.setAttribute("rotation", `${-pitchDeg} ${yawDeg} 0`);
                el.setAttribute("position", "0 0 -8");

                // CLICK
                el.addEventListener("click", () => loadScene(h.target));

                container.appendChild(el);
            });
        }


        // START
        loadData();

    </script>

</body>

</html>
