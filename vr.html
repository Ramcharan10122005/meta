<!DOCTYPE html>
<html>

<head>
    <title>Afternoon VR Tour</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
</head>

<body>

    <a-scene vr-mode-ui="enabled: true">

        <!-- CAMERA -->
        <a-entity id="cam" camera look-controls position="0 1.6 0">

            <!-- CURSOR -->
            <a-cursor fuse="true" fuse-timeout="1000" raycaster="objects: .clickable"
                geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.02" material="color: white; shader: flat">
            </a-cursor>

        </a-entity>

        <!-- SKY -->
        <a-sky id="sky"></a-sky>

        <!-- HOTSPOTS -->
        <a-entity id="hotspots"></a-entity>

    </a-scene>

    <script>

        let scenesMap = {};
        let currentAudio = null;

        // LOAD DATA
        async function loadData() {

            let text = await fetch("./evening/app-files/data.js").then(r => r.text());

            let json = JSON.parse(
                text.replace("var APP_DATA =", "").trim().slice(0, -1)
            );

            json.scenes.forEach(s => scenesMap[s.id] = s);

            loadScene(json.scenes[0].id);
        }

        // LOAD SCENE
        function loadScene(id) {

            let scene = scenesMap[id];
            if (!scene) return;

            // SET IMAGE
            document.getElementById("sky")
                .setAttribute("src", "./vr-images/" + scene.name.toLowerCase() + ".jpg");

            // SET CAMERA VIEW (MATCH MARZIPANO)
            let cam = document.getElementById("cam");

            let yaw = scene.initialViewParameters?.yaw || 0;
            let pitch = scene.initialViewParameters?.pitch || 0;

            cam.setAttribute("rotation", {
                x: THREE.MathUtils.radToDeg(pitch),
                y: THREE.MathUtils.radToDeg(-yaw), // 🔥 important
                z: 0
            });

            // AUDIO
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }

            currentAudio = new Audio("./audio/" + scene.name.toLowerCase() + ".mp3");
            currentAudio.play().catch(() => { });

            // CLEAR HOTSPOTS
            let container = document.getElementById("hotspots");
            container.innerHTML = "";

            let hotspots = scene.linkHotspots || [];

            hotspots.forEach(h => {

                if (!scenesMap[h.target]) return;

                let el = document.createElement("a-entity");

                // 🔵 VISUAL
                el.setAttribute("geometry", "primitive: circle; radius: 0.4");
                el.setAttribute("material", "color: #00ffff; shader: flat");

                // 🔥 KEY IDEA: use rotation instead of position
                el.setAttribute("rotation", {
                    x: THREE.MathUtils.radToDeg(-h.pitch),
                    y: THREE.MathUtils.radToDeg(-h.yaw),
                    z: 0
                });

                // push forward from center
                el.setAttribute("position", "0 0 -10");

                el.setAttribute("look-at", "#cam");
                el.setAttribute("class", "clickable");

                // animation
                el.setAttribute("animation__scale", {
                    property: "scale",
                    dir: "alternate",
                    dur: 800,
                    loop: true,
                    to: "1.3 1.3 1.3"
                });

                // click
                el.addEventListener("click", () => loadScene(h.target));

                container.appendChild(el);
            });
        }

        // START
        loadData();

    </script>

</body>

</html>
